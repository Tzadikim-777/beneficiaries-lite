
# ==========================================
# SERVIDOR HTTP
# ==========================================
quarkus.http.port=8080

# ==========================================
# DATASOURCE H2
# ==========================================
quarkus.datasource.db-kind=h2

# ==========================================
# DESARROLLO
# ==========================================
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:beneficiaries;DB_CLOSE_DELAY=-1
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# ==========================================
# PRUEBAS
# ==========================================
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:beneficiaries_test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# ==========================================
# PRODUCCIÓN
# ==========================================
%prod.quarkus.hibernate-orm.schema-management.strategy=none

# ==========================================
# LOGGING
# ==========================================
quarkus.log.level=INFO
